<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FillMate</title>

    <link
        rel="stylesheet"
        href="popup.css"
    >

</head>


<body>

    <div class="app">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="topbar">

            <div class="brand">

                <!-- ACTUAL FILLMATE LOGO -->

                <div class="brand-logo">

    <svg
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg"
    >

        <rect
            width="100"
            height="100"
            rx="28"
            fill="#202522"
        />

        <path
            d="M28 22H75L67 35H43V45H65L57 58H43V68L28 78V22Z"
            fill="#F7F6F2"
        />

        <path
            d="M28 45H43V58H28V45Z"
            fill="#C4CCC8"
        />

    </svg>

</div>


                <div class="brand-name">
                    FillMate
                </div>

            </div>


            <div class="ready">

                <span class="ready-dot"></span>

                Ready

            </div>

        </header>



        <!-- =========================
             INTRO
        ========================== -->

        <section class="intro">

            <div class="small-label">
                YOUR BROWSER ASSISTANT
            </div>


            <h1 id="heading">

                What can I help<br>
                you with?

            </h1>

        </section>



        <!-- =========================
             FEATURE CARDS
        ========================== -->

        <section class="actions">


            <!-- FILL FORMS -->

            <button
                id="fillMode"
                class="action-card active"
                type="button"
            >

                <div class="action-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <path
                            d="M7 3.5H14L18 7.5V20.5H7V3.5Z"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M14 3.5V7.5H18"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M10 11H15"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                        />

                        <path
                            d="M10 14.5H15"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                        />

                    </svg>

                </div>


                <div class="action-text">

                    <strong>
                        Fill forms
                    </strong>

                    <span>
                        Complete forms faster
                    </span>

                </div>


                <div class="action-arrow">
                    ↗
                </div>

            </button>



            <!-- SUMMARIZE -->

            <button
                id="summaryMode"
                class="action-card"
                type="button"
            >

                <div class="action-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <path
                            d="M7 3.5H14L18 7.5V20.5H7V3.5Z"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M14 3.5V7.5H18"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M10 11H15"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                        />

                        <path
                            d="M10 14.5H13"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                        />

                    </svg>

                </div>


                <div class="action-text">

                    <strong>
                        Summarize
                    </strong>

                    <span>
                        Understand this document
                    </span>

                </div>


                <div class="action-arrow">
                    ↗
                </div>

            </button>

        </section>



        <!-- =========================
             USER INPUT
        ========================== -->

        <section class="input-box">


            <textarea
                id="userInput"
                placeholder="Tell me what you need..."
            ></textarea>



            <!-- MICROPHONE -->

            <button
                id="micButton"
                class="mic-button"
                type="button"
                title="Voice input"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                >

                    <path
                        d="M12 14.5C13.66 14.5 15 13.16 15 11.5V6.5C15 4.84 13.66 3.5 12 3.5C10.34 3.5 9 4.84 9 6.5V11.5C9 13.16 10.34 14.5 12 14.5Z"
                        stroke="currentColor"
                        stroke-width="1.5"
                    />

                    <path
                        d="M5.5 11C5.5 14.59 8.41 17.5 12 17.5C15.59 17.5 18.5 14.59 18.5 11"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                    />

                    <path
                        d="M12 17.5V21"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                    />

                </svg>

            </button>

        </section>



        <!-- =========================
             MAIN BUTTON
        ========================== -->

        <button
            id="fillButton"
            class="primary-button"
            type="button"
        >

            <span id="buttonText">
                Analyze form
            </span>


            <svg
                viewBox="0 0 24 24"
                fill="none"
            >

                <path
                    d="M5 12H19"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                />

                <path
                    d="M13 6L19 12L13 18"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </svg>

        </button>



        <!-- =========================
             FOOTER
        ========================== -->

        <footer>

            <span>
                FillMate
            </span>

            <span class="footer-dot">
                ·
            </span>

            <span>
                Private by design
            </span>

        </footer>


    </div>


    <script src="popup.js"></script>

</body>

</html>
